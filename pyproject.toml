[project]
name = "snakemake-executor-plugin-slurm-drmaa"
version = "0.1.0"
description = "A Snakemake executor plugin that submits jobs to Slurm through slurm-drmaa, using the resource names of the Slurm executor plugin."
readme = "README.md"
license = "GNU General Public License v3.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Dinindu Senanayake", email = "dini.senanayake@kennedy.ox.ac.uk" },
]
keywords = ["snakemake", "plugin", "executor", "cluster", "drmaa", "slurm"]
dependencies = [
    "snakemake-interface-common>=1.13.0,<2",
    "snakemake-interface-executor-plugins>=9.0.0,<10",
    "drmaa>=0.7.9",
]

[project.urls]
Repository = "https://github.com/kir-rescomp/snakemake-executor-plugin-slurm-drmaa"
Upstream = "https://github.com/snakemake/snakemake-executor-plugin-drmaa"

[dependency-groups]
dev = ["pytest>=8", "snakemake>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snakemake_executor_plugin_slurm_drmaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
